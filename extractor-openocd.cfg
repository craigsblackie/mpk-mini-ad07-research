# OpenOCD server for CVE-2020-8004 exception-based extraction.
# This configuration permits CPU reset/halt and volatile SRAM/register writes.
# It contains no flash bank command beyond the STM32F1 target declaration,
# no flash programming/erase command, and no option-byte command.
source [find interface/cmsis-dap.cfg]
adapter serial DAP_Himimoni
transport select swd

set WORKAREASIZE 0
source [find target/stm32f1x.cfg]

# Avoid the stock target script's write to volatile DBGMCU_CR on examination.
stm32f1x.cpu configure -event examine-end {}
adapter speed 50
reset_config none

gdb_port disabled
telnet_port disabled
tcl_port 6666

init
