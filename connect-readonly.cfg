# Confirmed with OpenOCD 0.12.0 and Flipper DAP_Himimoni.
# No reset, halt, flash programming, option-byte changes, or unlock.
source [find interface/cmsis-dap.cfg]
adapter serial DAP_Himimoni
transport select swd
set WORKAREASIZE 0
source [find target/stm32f1x.cfg]
# Disable the stock target's volatile DBGMCU_CR write on examination.
stm32f1x.cpu configure -event examine-end {}
adapter speed 50
reset_config none
gdb_port disabled
telnet_port disabled
tcl_port disabled
init
mdw 0xE0042000 1
mdw 0x4002201C 1
shutdown
